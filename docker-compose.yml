version: '3.8'

services:
  civicfix-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: civicfix-backend-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=Sqlite
      - ConnectionStrings__SqliteConnection=Data Source=/app/data/civicfix_prod.db
    volumes:
      - civicfix-db-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/analytics/kpis"]
      interval: 30s
      timeout: 10s
      retries: 3

  civicfix-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: civicfix-frontend-web
    ports:
      - "5173:80"
    depends_on:
      - civicfix-api
    restart: unless-stopped

  civicfix-ml:
    build:
      context: .
      dockerfile: docker/Dockerfile.ml
    container_name: civicfix-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  civicfix-db-data:
    driver: local
